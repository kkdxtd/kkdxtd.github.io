{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a href="{{ base_path }}/" class="site-brand-link">
              <span class="brand-avatar-mini"><img src="{{ base_path }}/images/profile.jpg" alt="Wenzhuo Li" /></span>
              <span class="brand-title">{{ site.title }}</span>
              <span class="brand-cn">李文卓</span>
            </a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">
                {% if link.icon %}<i class="{{ link.icon }} nav-icon" aria-hidden="true"></i>{% endif %}
                <span>{{ link.title }}</span>
              </a>
            </li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail theme-toggle-item" title="Toggle dark/light theme">
            <a role="button" aria-labelledby="theme-icon" class="theme-toggle-link">
              <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i>
            </a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
